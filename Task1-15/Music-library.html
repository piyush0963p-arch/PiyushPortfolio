<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Library | Premium Streaming</title>
    <style>
        /* Modern Web Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        /* CSS Variables for Premium Dark/Neon Theme */
        :root {
            --bg-base: #09090e;
            --bg-surface: #141421;
            --bg-glass: rgba(20, 20, 33, 0.7);
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent-cyan: #00f2fe;
            --accent-purple: #4facfe;
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            line-height: 1.5;
            padding-bottom: 100px; /* Space for the fixed player */
        }

        /* Top Navigation */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.5rem 5%; background-color: var(--bg-glass);
            backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand { font-size: 1.8rem; font-weight: 800; background: linear-gradient(to right, var(--accent-cyan), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .nav-links a { color: var(--text-primary); text-decoration: none; margin-left: 2rem; font-weight: 600; transition: var(--transition); }
        .nav-links a:hover { color: var(--accent-cyan); }

        /* Main Container & Layout */
        .container { max-width: 1400px; margin: 0 auto; padding: 3rem 5%; }
        .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; }
        h2 { font-size: 2rem; font-weight: 800; }

        /* Challenge: Top 10 Songs Chart */
        .chart-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; margin-bottom: 4rem;
        }

        .song-row {
            display: flex; align-items: center; background: var(--bg-surface); padding: 0.8rem 1rem;
            border-radius: 8px; transition: var(--transition); cursor: pointer; border: 1px solid transparent;
        }

        .song-row:hover { background: #1f1f33; border-color: rgba(0, 242, 254, 0.3); transform: translateX(5px); }
        
        .rank { font-size: 1.2rem; font-weight: 800; color: var(--text-secondary); width: 30px; }
        .song-cover { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; margin-right: 1rem; }
        .song-details { flex-grow: 1; }
        .song-title { font-weight: 600; font-size: 1.1rem; }
        .song-artist { color: var(--text-secondary); font-size: 0.9rem; }
        
        .play-btn {
            background: none; border: none; color: var(--accent-cyan); font-size: 1.5rem;
            cursor: pointer; opacity: 0; transition: var(--transition);
        }
        .song-row:hover .play-btn { opacity: 1; }

        /* Categories Section */
        .categories-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; }
        
        .category-card {
            background: linear-gradient(45deg, var(--bg-surface), #2a2a45);
            padding: 2rem 1rem; text-align: center; border-radius: 12px;
            cursor: pointer; transition: var(--transition);
        }
        
        .category-card:hover { transform: translateY(-8px); box-shadow: 0 10px 20px rgba(0, 242, 254, 0.1); }
        .category-icon { font-size: 2.5rem; margin-bottom: 1rem; }
        .category-name { font-weight: 800; font-size: 1.2rem; }

        /* Global Persistent Audio Player */
        .player-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 90px;
            background: var(--bg-glass); backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 5%; z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }

        .now-playing { display: flex; align-items: center; width: 30%; }
        .now-playing img { width: 60px; height: 60px; border-radius: 8px; margin-right: 1rem; object-fit: cover; }
        
        .audio-controls { width: 40%; display: flex; justify-content: center; }
        audio { width: 100%; max-width: 500px; outline: none; }
        
        /* Customizing the default HTML5 audio player for dark mode */
        audio::-webkit-media-controls-panel { background-color: #e5e7eb; border-radius: 30px; }

        .extra-controls { width: 30%; display: flex; justify-content: flex-end; color: var(--text-secondary); }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(9, 9, 14, 0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        /* Modal Card */
        .modal-card {
            background-color: var(--bg-surface);
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 550px;
            width: 90%;
            position: relative;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .modal-overlay.open .modal-card {
            transform: translateY(0);
        }

        /* Close Button */
        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--accent-cyan);
        }

        /* Song row styling in Modal */
        .modal-song-row {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            margin-bottom: 0.8rem;
            transition: var(--transition);
            cursor: pointer;
            border: 1px solid transparent;
        }

        .modal-song-row:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 242, 254, 0.2);
            transform: translateX(3px);
        }

        /* Media Queries for Mobile Responsiveness */
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 1rem;
                padding: 1.2rem;
                text-align: center;
            }
            .nav-links a {
                margin: 0 1rem;
            }
            .container {
                padding: 2rem 1.25rem;
            }
            .chart-grid {
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }
            .categories-grid {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 1rem;
            }
            .category-card {
                padding: 1.5rem 0.5rem;
            }
            .category-icon {
                font-size: 2rem;
                margin-bottom: 0.5rem;
            }
            .category-name {
                font-size: 1rem;
            }
            .player-bar {
                flex-direction: column;
                height: auto;
                padding: 1rem;
                gap: 0.8rem;
            }
            .now-playing {
                width: 100%;
                justify-content: center;
            }
            .audio-controls {
                width: 100%;
            }
            .extra-controls {
                display: none;
            }
            body {
                padding-bottom: 180px; /* Leave space for stacked player bar */
            }
            .modal-card {
                padding: 2rem 1.25rem;
            }
        }
    </style>
</head>

                { title: "Canon in D Major", artist: "Pachelbel Players", cover: "https://images.unsplash.com/photo-1465847899084-d164df4dedc6?q=80&w=200&auto=format&fit=crop", audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
                { title: "Nocturne Op. 9", artist: "Chopin Interpretations", cover: "https://images.unsplash.com/photo-1510915361894-db8b60106cb1?q=80&w=200&auto=format&fit=crop", audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" },
                { title: "The Four Seasons", artist: "Vivaldi Consort", cover: "https://images.unsplash.com/photo-1511192336575-5a79af67a629?q=80&w=200&auto=format&fit=crop", audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3" }
            ]
        };

        // --- 5. JavaScript: Category Cards Clicking to Open Playlists ---
        const playlistModal = document.getElementById('playlistModal');
        const closePlaylistModal = document.getElementById('closePlaylistModal');
        const modalPlaylistTitle = document.getElementById('modalPlaylistTitle');
        const playlistSongsContainer = document.getElementById('playlistSongsContainer');

        function openCategoryPlaylist(categoryName) {
            const tracks = categoryPlaylists[categoryName];
            if (!tracks) return;

            // Set title
            modalPlaylistTitle.textContent = `${categoryName} Playlist`;
            playlistSongsContainer.innerHTML = '';

            // Render songs
            tracks.forEach((track, index) => {
                const songRow = document.createElement('div');
                songRow.classList.add('modal-song-row');
                songRow.onclick = () => {
                    playSong(track);
                    playlistModal.classList.remove('open');
                };

                songRow.innerHTML = `
                    <div class="rank" style="margin-right: 15px; font-weight: 800; color: var(--text-secondary); width: 25px;">${index + 1}</div>
                    <img src="${track.cover}" class="song-cover" alt="Cover" style="width: 45px; height: 45px; margin-right: 15px; border-radius: 4px; object-fit: cover;">
                    <div class="song-details" style="flex-grow: 1;">
                        <div class="song-title" style="font-size: 1rem; font-weight: 600;">${track.title}</div>
                        <div class="song-artist" style="font-size: 0.85rem; color: var(--text-secondary);">${track.artist}</div>
                    </div>
                    <button class="play-btn" style="opacity: 1; margin-left: auto;">▶</button>
                `;

                playlistSongsContainer.appendChild(songRow);
            });

            // Open modal
            playlistModal.classList.add('open');
        }

        // Add event listeners to category cards
        const categoryCards = document.querySelectorAll('.category-card');
        categoryCards.forEach(card => {
            card.addEventListener('click', () => {
                const categoryName = card.querySelector('.category-name').textContent.trim();
                openCategoryPlaylist(categoryName);
            });
        });

        // Close modal
        closePlaylistModal.addEventListener('click', () => {
            playlistModal.classList.remove('open');
        });

        // Close on clicking backdrop
        playlistModal.addEventListener('click', (e) => {
            if (e.target === playlistModal) {
                playlistModal.classList.remove('open');
            }
        });
    </script>
</body>
</html>
