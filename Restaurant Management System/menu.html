<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Management - DineFlow AI</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/design-system.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/pages/menu.css">
</head>
<body>
    
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i data-lucide="chef-hat"></i>
                    DineFlow<span class="text-primary">AI</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    Dashboard
                </a>
                <a href="menu.html" class="nav-item active">
                    <i data-lucide="book-open"></i>
                    Menu Management
                </a>
                <a href="ordering.html" class="nav-item">
                    <i data-lucide="shopping-cart"></i>
                    Customer Ordering
                </a>
                <a href="pos.html" class="nav-item">
                    <i data-lucide="monitor"></i>
                    POS System
                </a>
                <a href="tables.html" class="nav-item">
                    <i data-lucide="calendar-days"></i>
                    Table Booking
                </a>
                <a href="kitchen.html" class="nav-item">
                    <i data-lucide="flame"></i>
                    Kitchen Dashboard
                </a>
                <a href="inventory.html" class="nav-item">
                    <i data-lucide="package"></i>
                    Inventory
                </a>
                <a href="staff.html" class="nav-item">
                    <i data-lucide="users"></i>
                    Staff Management
                </a>
                <a href="customers.html" class="nav-item">
                    <i data-lucide="contact"></i>
                    Customers
                </a>
                <a href="analytics.html" class="nav-item">
                    <i data-lucide="bar-chart-3"></i>
                    Analytics & Reports
                </a>
                <a href="ai-insights.html" class="nav-item text-accent">
                    <i data-lucide="sparkles"></i>
                    AI Insights
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <a href="profile.html" class="user-avatar" style="text-decoration:none;">AD</a>
                <div class="user-info">
                    <a href="profile.html" class="user-name" style="text-decoration:none;">Admin User</a>
                    <div class="user-role">Restaurant Owner</div>
                </div>
                <button class="icon-btn theme-toggle" style="border:none;">
                    <i data-lucide="moon"></i>
                </button>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="topbar-left">
                    <h1 class="page-title">Menu Management</h1>
                </div>
                
                <div class="search-bar">
                    <i data-lucide="search"></i>
                    <input type="text" placeholder="Search dishes...">
                </div>
                
                <div class="topbar-right">
                    <button class="icon-btn">
                        <i data-lucide="bell"></i>
                        <span class="notification-badge"></span>
                    </button>
                    <a href="settings.html" class="icon-btn">
                        <i data-lucide="settings"></i>
                    </a>
                </div>
            </header>
            
            <!-- Content -->
            <div class="content-wrapper">
                <div class="menu-header-actions">
                    <div class="menu-filters">
                        <button class="filter-btn active" data-category="all">All Items</button>
                        <button class="filter-btn" data-category="starters">Starters</button>
                        <button class="filter-btn" data-category="mains">Mains</button>
                        <button class="filter-btn" data-category="desserts">Desserts</button>
                        <button class="filter-btn" data-category="beverages">Beverages</button>
                    </div>
                    
                    <button id="addDishBtn" class="btn btn-primary">
                        <i data-lucide="plus"></i> Add New Dish
                    </button>
                </div>
                
                <!-- Menu Grid -->
                <div id="menuGrid" class="menu-grid">
                    <!-- Loaded dynamically via menu.js -->
                </div>
            </div>
        </main>
    </div>

    <!-- Add Dish Modal -->
    <div id="addDishModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Add New Dish</h2>
                <button id="closeModalBtn" class="close-btn">&times;</button>
            </div>
            <form id="addDishForm">
                <div class="form-group">
                    <label for="dishName" class="form-label">Dish Name</label>
                    <input type="text" id="dishName" class="form-control" placeholder="e.g. Garlic Butter Prawns" required>
                </div>
                
                <div class="form-group">
                    <label for="dishPrice" class="form-label">Price ($)</label>
                    <input type="number" id="dishPrice" step="0.01" class="form-control" placeholder="e.g. 18.50" required>
                </div>
                
                <div class="form-group">
                    <label for="dishCategory" class="form-label">Category</label>
                    <select id="dishCategory" class="form-control" required>
                        <option value="starters">Starters</option>
                        <option value="mains">Mains</option>
                        <option value="desserts">Desserts</option>
                        <option value="beverages">Beverages</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="dishIcon" class="form-label">Icon type</label>
                    <select id="dishIcon" class="form-control">
                        <option value="pizza">Pizza</option>
                        <option value="beef">Meat / Steak</option>
                        <option value="fish">Fish / Seafood</option>
                        <option value="coffee">Beverage</option>
                        <option value="cake">Dessert</option>
                        <option value="chef-hat">Generic Dish</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="dishDescription" class="form-label">Description</label>
                    <textarea id="dishDescription" class="form-control" rows="3" placeholder="Describe the ingredients and taste..." required></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Save Dish</button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/app.js"></script>
    <script src="assets/js/pages/menu.js"></script>
</body>
</html>
