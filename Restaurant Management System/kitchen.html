<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Dashboard - DineFlow AI</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/design-system.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/pages/menu.css">
    <link rel="stylesheet" href="assets/css/pages/kitchen.css">
</head>
<body>
    
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i data-lucide="chef-hat"></i>
                    DineFlow<span class="text-primary">AI</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    Dashboard
                </a>
                <a href="menu.html" class="nav-item">
                    <i data-lucide="book-open"></i>
                    Menu Management
                </a>
                <a href="ordering.html" class="nav-item">
                    <i data-lucide="shopping-cart"></i>
                    Customer Ordering
                </a>
                <a href="pos.html" class="nav-item">
                    <i data-lucide="monitor"></i>
                    POS System
                </a>
                <a href="tables.html" class="nav-item">
                    <i data-lucide="calendar-days"></i>
                    Table Booking
                </a>
                <a href="kitchen.html" class="nav-item active">
                    <i data-lucide="flame"></i>
                    Kitchen Dashboard
                </a>
                <a href="inventory.html" class="nav-item">
                    <i data-lucide="package"></i>
                    Inventory
                </a>
                <a href="staff.html" class="nav-item">
                    <i data-lucide="users"></i>
                    Staff Management
                </a>
                <a href="customers.html" class="nav-item">
                    <i data-lucide="contact"></i>
                    Customers
                </a>
                <a href="analytics.html" class="nav-item">
                    <i data-lucide="bar-chart-3"></i>
                    Analytics & Reports
                </a>
                <a href="ai-insights.html" class="nav-item text-accent">
                    <i data-lucide="sparkles"></i>
                    AI Insights
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <a href="profile.html" class="user-avatar" style="text-decoration:none;">AD</a>
                <div class="user-info">
                    <a href="profile.html" class="user-name" style="text-decoration:none;">Admin User</a>
                    <div class="user-role">Restaurant Owner</div>
                </div>
                <button class="icon-btn theme-toggle" style="border:none;">
                    <i data-lucide="moon"></i>
                </button>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="topbar-left">
                    <h1 class="page-title">Kitchen Monitor</h1>
                </div>
                
                <div class="search-bar">
                    <i data-lucide="search"></i>
                    <input type="text" placeholder="Search ticket #...">
                </div>
                
                <div class="topbar-right">
                    <button class="icon-btn">
                        <i data-lucide="bell"></i>
                        <span class="notification-badge"></span>
                    </button>
                    <a href="settings.html" class="icon-btn">
                        <i data-lucide="settings"></i>
                    </a>
                </div>
            </header>
            
            <!-- Kanban Board -->
            <div class="content-wrapper">
                <div class="kitchen-kanban">
                    
                    <!-- NEW -->
                    <div class="kanban-column">
                        <div class="kanban-column-header">
                            <span class="kanban-column-title">Incoming</span>
                            <span class="badge badge-danger" id="newCount">0</span>
                        </div>
                        <div class="kanban-cards-container" id="newList">
                            <!-- Items populated dynamically -->
                        </div>
                    </div>
                    
                    <!-- PREPARING -->
                    <div class="kanban-column">
                        <div class="kanban-column-header">
                            <span class="kanban-column-title">Preparing</span>
                            <span class="badge badge-warning" id="preparingCount">0</span>
                        </div>
                        <div class="kanban-cards-container" id="preparingList">
                            <!-- Items populated dynamically -->
                        </div>
                    </div>
                    
                    <!-- READY -->
                    <div class="kanban-column">
                        <div class="kanban-column-header">
                            <span class="kanban-column-title">Ready for Pick Up</span>
                            <span class="badge badge-info" id="readyCount">0</span>
                        </div>
                        <div class="kanban-cards-container" id="readyList">
                            <!-- Items populated dynamically -->
                        </div>
                    </div>
                    
                    <!-- SERVED -->
                    <div class="kanban-column">
                        <div class="kanban-column-header">
                            <span class="kanban-column-title">Served</span>
                            <span class="badge badge-success" id="servedCount">0</span>
                        </div>
                        <div class="kanban-cards-container" id="servedList">
                            <!-- Items populated dynamically -->
                        </div>
                    </div>
                    
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="assets/js/app.js"></script>
    <script src="assets/js/pages/kitchen.js"></script>
</body>
</html>
