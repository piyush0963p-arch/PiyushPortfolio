<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - DineFlow AI</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/design-system.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/pages/menu.css">
    <link rel="stylesheet" href="assets/css/pages/profile.css">
</head>
<body>
    
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i data-lucide="chef-hat"></i>
                    DineFlow<span class="text-primary">AI</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    Dashboard
                </a>
                <a href="menu.html" class="nav-item">
                    <i data-lucide="book-open"></i>
                    Menu Management
                </a>
                <a href="ordering.html" class="nav-item">
                    <i data-lucide="shopping-cart"></i>
                    Customer Ordering
                </a>
                <a href="pos.html" class="nav-item">
                    <i data-lucide="monitor"></i>
                    POS System
                </a>
                <a href="tables.html" class="nav-item">
                    <i data-lucide="calendar-days"></i>
                    Table Booking
                </a>
                <a href="kitchen.html" class="nav-item">
                    <i data-lucide="flame"></i>
                    Kitchen Dashboard
                </a>
                <a href="inventory.html" class="nav-item">
                    <i data-lucide="package"></i>
                    Inventory
                </a>
                <a href="staff.html" class="nav-item">
                    <i data-lucide="users"></i>
                    Staff Management
                </a>
                <a href="customers.html" class="nav-item">
                    <i data-lucide="contact"></i>
                    Customers
                </a>
                <a href="analytics.html" class="nav-item">
                    <i data-lucide="bar-chart-3"></i>
                    Analytics & Reports
                </a>
                <a href="ai-insights.html" class="nav-item text-accent">
                    <i data-lucide="sparkles"></i>
                    AI Insights
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <a href="profile.html" class="user-avatar" style="text-decoration:none;">AD</a>
                <div class="user-info">
                    <a href="profile.html" class="user-name" style="text-decoration:none;">Admin User</a>
                    <div class="user-role">Restaurant Owner</div>
                </div>
                <button class="icon-btn theme-toggle" style="border:none;">
                    <i data-lucide="moon"></i>
                </button>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="topbar-left">
                    <h1 class="page-title">Admin Account</h1>
                </div>
                
                <div class="topbar-right">
                    <button class="icon-btn">
                        <i data-lucide="bell"></i>
                        <span class="notification-badge"></span>
                    </button>
                    <a href="settings.html" class="icon-btn">
                        <i data-lucide="settings"></i>
                    </a>
                </div>
            </header>
            
            <!-- Profile Info Grid -->
            <div class="content-wrapper">
                <div class="profile-grid">
                    
                    <!-- Left: avatar card -->
                    <div class="card text-center glass">
                        <div class="profile-avatar-big" id="profileAvatarBig">AD</div>
                        <h2 style="font-size:1.25rem; font-weight:600; margin-bottom:0.25rem;">Admin User</h2>
                        <p style="font-size:0.8rem; color:var(--text-muted); margin:0;">Super Administrator</p>
                    </div>
                    
                    <!-- Right: edit form -->
                    <div class="card">
                        <form id="profileForm">
                            <h2 style="font-size:1.1rem; font-weight:600; margin-bottom:1.5rem;">Update Information</h2>
                            <div class="form-group">
                                <label for="profileName" class="form-label">Full Name</label>
                                <input type="text" id="profileName" class="form-control" required>
                            </div>
                            <div class="form-group" style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                                <div>
                                    <label for="profileEmail" class="form-label">Email Address</label>
                                    <input type="email" id="profileEmail" class="form-control" required>
                                </div>
                                <div>
                                    <label for="profilePhone" class="form-label">Phone Number</label>
                                    <input type="text" id="profilePhone" class="form-control" required>
                                </div>
                            </div>
                            
                            <hr style="border:none; border-top:1px solid var(--border); margin:1.5rem 0;">
                            
                            <h2 style="font-size:1.1rem; font-weight:600; margin-bottom:1.5rem;">Security & Password</h2>
                            <div class="form-group" style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                                <div>
                                    <label for="profilePassword" class="form-label">New Password</label>
                                    <input type="password" id="profilePassword" class="form-control" placeholder="••••••••">
                                </div>
                                <div>
                                    <label for="profileConfirm" class="form-label">Confirm New Password</label>
                                    <input type="password" id="profileConfirm" class="form-control" placeholder="••••••••">
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary" style="margin-top:1.5rem; padding:0.6rem 2rem;">Save Changes</button>
                        </form>
                    </div>
                    
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="assets/js/app.js"></script>
    <script src="assets/js/pages/profile.js"></script>
</body>
</html>
